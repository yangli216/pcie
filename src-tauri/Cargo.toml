[package]
name = "pcie"
version = "1.4.6"
description = "Primary Care Intelligent Expert desktop workstation for primary care clinicians"
authors = ["PCIE Team"]
repository = "https://github.com/yangli216/pcie"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pcie_lib"
# This product ships as a desktop app. Mobile-only static/dynamic library
# outputs duplicate hundreds of MB on every dev build, so keep the Rust rlib.
crate-type = ["rlib"]

[features]
default = []
win7-legacy = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2.5.0", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
actix-web = "4.12.1"
actix-cors = "0.7.1"
actix-ws = "0.3.0"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
url = "2"
rfd = "0.17.2"
window-vibrancy = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.dev]
# Keep useful file/line information while avoiding full dependency debug data.
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
# 增加并行编译单元数量，加快构建速度
codegen-units = 16
# 禁用链接时优化 (LTO)，大幅缩短链接时间
lto = false
# 保持高优化级别，确保运行速度
opt-level = 3
# Release builds are infrequent; incremental caches otherwise accumulate quickly.
incremental = false
# 去除符号信息以进一步缩小包体积并略微加快链接
strip = true
