name: Windows 7 Legacy Test Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Win7 候选版本（X.Y.Z-win7[.N]，例如 1.4.8-win7.1）'
        required: true
        type: string

concurrency:
  group: win7-test-build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WIN7_TARGET: x86_64-win7-windows-msvc
  WIN7_RUST_TOOLCHAIN: nightly-2025-08-01
  WIN7_REQUIRED_WEBVIEW2_MAJOR: '109'
  PCIE_WIN7_BUILD: '1'
  VITE_PCIE_BUILD_FLAVOR: win7
  VITE_UPDATE_ENVIRONMENT: testing

jobs:
  build-win7-legacy:
    runs-on: windows-2022
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.WIN7_RUST_TOOLCHAIN }}
          components: rust-src

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2.8.2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ env.WIN7_RUST_TOOLCHAIN }}-${{ env.WIN7_TARGET }}-tauri-utils-win7

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Validate isolated build configuration and candidate version
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/test-release.mjs --win7 --version "$env:CANDIDATE_VERSION" --dry-run
          yarn test:win7-build
          yarn test:release
          $targets = rustc --print target-list
          if ($targets -notcontains $env:WIN7_TARGET) {
            throw "Pinned Rust toolchain does not expose target $env:WIN7_TARGET"
          }

      - name: Run frontend quality gates for WebView2 109
        shell: pwsh
        env:
          VITE_REGIONAL_BASE_URL: ${{ vars.VITE_REGIONAL_BASE_URL }}
        run: |
          yarn type-check
          yarn test:unit
          yarn build

      - name: Build unsigned Win7 legacy candidate
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          RUSTUP_TOOLCHAIN: ${{ env.WIN7_RUST_TOOLCHAIN }}
          VITE_REGIONAL_BASE_URL: ${{ vars.VITE_REGIONAL_BASE_URL }}
        run: |
          # Tauri validates --target against rustup's downloadable component
          # list. Tier-3 targets are built from rust-src and never appear in
          # that list, so temporarily hide only the rustup command from Tauri.
          # cargo.exe and rustc continue using the pinned RUSTUP_TOOLCHAIN.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $rustupPath = (Get-Command rustup.exe -ErrorAction Stop).Source
          $hiddenRustupPath = "$rustupPath.tauri-win7-target-check"
          Move-Item $rustupPath $hiddenRustupPath
          try {
            cargo --version
            rustc --version
            node scripts/test-release.mjs --win7 --version "$env:CANDIDATE_VERSION" -- --config src-tauri/tauri.win7.conf.json --target "$env:WIN7_TARGET"
          }
          finally {
            Move-Item $hiddenRustupPath $rustupPath
          }

      - name: Verify installer and record provenance
        id: artifact
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $bundlePath = "src-tauri/target/$env:WIN7_TARGET/release/bundle/msi"
          if (-not (Test-Path $bundlePath -PathType Container)) {
            throw "Win7 MSI bundle directory is missing: $bundlePath"
          }
          $installers = @(Get-ChildItem $bundlePath -File -Filter '*.msi' | Where-Object Length -GT 1MB)
          if ($installers.Count -eq 0) {
            throw "Win7 MSI bundle directory contains no installer larger than 1 MB: $bundlePath"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          $manifest = [ordered]@{
            version = $env:CANDIDATE_VERSION
            flavor = 'win7-legacy-validation'
            updateChannel = 'win7-testing'
            commit = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            target = $env:WIN7_TARGET
            rustToolchain = $env:WIN7_RUST_TOOLCHAIN
            webView2InstallMode = 'external'
            requiredExternalWebView2Major = $env:WIN7_REQUIRED_WEBVIEW2_MAJOR
            installer = $installers[0].Name
            published = $false
            updaterEnabled = $false
            realWin7SmokeTestRequired = $true
          }
          $manifest | ConvertTo-Json | Set-Content dist/win7-build-manifest.json -Encoding utf8
          "bundle_path=$bundlePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Win7 validation artifact only
        uses: actions/upload-artifact@v4
        with:
          name: pcie-win7-legacy-${{ inputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.bundle_path }}
            dist/win7-build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Record validation boundary
        shell: pwsh
        run: |
          @"
          ## Windows 7 legacy technical build

          - Artifact only; no tag, release, update metadata, or update channel was created.
          - Target: ``$env:WIN7_TARGET``
          - Rust: ``$env:WIN7_RUST_TOOLCHAIN`` with ``rust-src`` and ``build-std``
          - External prerequisite: WebView2 ``$env:WIN7_REQUIRED_WEBVIEW2_MAJOR`` must be installed separately on the Win7 test machine.
          - A real Windows 7 SP1 x64 smoke test is still required before compatibility can be claimed.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
